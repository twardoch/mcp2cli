[project]
name = "mcp2cli"
version = "3.1.0"
description = "Turn any MCP server, OpenAPI spec, or GraphQL endpoint into a CLI"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Stephan Fitzpatrick", email = "stephan@knowsuchagency.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "mcp>=1.0",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "tiktoken"]

[project.urls]
Homepage = "https://github.com/knowsuchagency/mcp2cli"
Repository = "https://github.com/knowsuchagency/mcp2cli"
Documentation = "https://github.com/knowsuchagency/mcp2cli/tree/main/docs"

[project.scripts]
mcp2cli = "mcp2cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
